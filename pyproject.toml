[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebl-experiments"
version = "0.1.0"
description = "Crossbar hardware-aware training and on-chip learning experiments"
requires-python = ">=3.10"

[project.scripts]
ebl = "ebl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "campaigns",
  "ebl",
  "experiments",
  "experiments.cifar_crossbar",
  "experiments.cifar10_crossbar",
  "experiments.mnist_analog_relu",
  "experiments.mnist_relu",
  "experiments.reram_program_verify",
  "labs",
  "labs.tools",
  "training",
  "workflow",
  "workflow.networks",
]
exclude = [
  "labs.MNIST_network_data*",
  "labs.configs*",
  "labs.figures_for_paper_digits*",
  "labs.i_v_npz*",
  "labs.shfiles*",
]
namespaces = true
